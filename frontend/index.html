<!DOCTYPE html>
<html lang = "zh-TW">

    <!-- 告訴瀏覽器的資訊 -->
    <head>
        <title>Bobok</title>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="author" content="Chen Bo An">
        <meta name="description" content="個人圖書管理系統">
    </head>

    <!-- 呈現在網頁上的資訊 -->
    <body>
        <div class="index_page">
            <!-- Title -->
            <div class="index_title">
                <h3>Bobok</h3>
            </div>

            <!-- 個人資訊欄位 -->
            <div class="personal_information">
                <h4>個人資訊</h4>
                <div class="stat_item">
                    <label>借閱中:</label>
                    <span class="count">3</span>
                </div>
                <div class="stat_item">
                    <label>已預約:</label>
                    <span class="count">4</span>
                </div>
                <div class="stat_item">
                    <label>借出中:</label>
                    <span class="count">5</span>
                </div>

                <div class="borrow_list">
                    <label>借閱列表</label>
                    <table>
                        <tr>
                            <th>書名</th>
                            <th>借閱日期</th>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- 圖書清單欄位 -->
            <div class="book_list">

            </div>
        </div>
        

        <!-- 網頁功能 -->
        <script>
            
        </script>
    </body>
</html>
