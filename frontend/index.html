<!DOCTYPE html>
<html lang = "zh-TW">

    <!-- 告訴瀏覽器的資訊 -->
    <head>
        <title>Bobok</title>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="author" content="Chen Bo An">
        <meta name="description" content="個人圖書管理系統">
    </head>

    <!-- 呈現在網頁上的資訊 -->
    <body>
        <!-- Title -->
        <div class="index_title">
            <h2>Bobok</h2>
        </div>

        <div class="index_page">
            <!-- 個人資訊欄位 -->
            <div class="personal_information">
                <div class="profile_header">
                    <h4>個人資訊</h4>
                </div>

                <div class="stats_grid">
                    <div class="stat_item">
                        <label>借閱中</label>
                        <span class="count">3</span>
                    </div>
                    <div class="stat_item">
                        <label>已預約</label>
                        <span class="count">4</span>
                    </div>
                    <div class="stat_item">
                        <label>待確認</label>
                        <span class="count">4</span>
                    </div>
                    <div class="stat_item">
                        <label>借出中</label>
                        <span class="count">5</span>
                    </div>
                </div>

                <div class="confirm_section">
                    <label class="section_label">確認清單</label>
                    <table class="mini_table">
                        <thead>
                            <tr>
                                <th>書名</th>
                                <th>日期</th>
                                <th> </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>微積分精裝版</td>
                                <td>03-28</td>
                                <td><button class="btn_confirm">借出</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="borrow_section">
                    <label class="section_label">借閱清單</label>
                    <table class="mini_table">
                        <thead>
                            <tr>
                                <th>書名</th>
                                <th>日期</th>
                                <th> </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>微積分精裝版</td>
                                <td>03-28</td>
                                <td><button class="btn_return">歸還</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="book_list">
                <h4>圖書列表</h4>
                <div class="book_grid">
                    <p style="color: #666;">圖書內容載入中...</p>
                </div>
            </div>
        </div>
        

        <!-- 網頁功能 -->
        <script>
            
        </script>
    </body>
</html>
